name: PR validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the validated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run paper-first verification
        run: bash .agents/tools/verify.sh

      - name: Confirm checks did not mutate tracked files
        run: git diff --exit-code

  latex:
    name: latex
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the validated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Build through the Human interface
        run: make pdf

      - name: Require a non-empty PDF
        run: test -s paper/main.pdf

  paper-only:
    name: paper-only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the validated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Create a paper-only checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paper-only"
          cp -a paper "$RUNNER_TEMP/paper-only/paper"
          test ! -e "$RUNNER_TEMP/paper-only/.agents"

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Compile only the paper project
        run: |
          cd "$RUNNER_TEMP/paper-only/paper"
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
