name: PR validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the validated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run paper-first verification
        run: bash .agents/tools/verify.sh

      - name: Confirm checks did not mutate tracked files
        run: git diff --exit-code

  latex:
    name: latex (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [draft, anonymous, camera-ready, arxiv]
    steps:
      - name: Checkout the validated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install TeX and PDF text tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Build publication variant
        run: make pdf VARIANT="${{ matrix.variant }}"

      - name: Check variant surface
        shell: bash
        run: |
          set -euo pipefail
          variant="${{ matrix.variant }}"
          if [[ "$variant" == draft ]]; then
            pdf="paper/main.pdf"
          else
            pdf="paper/main-$variant.pdf"
          fi
          test -s "$pdf"
          pdftotext "$pdf" "$RUNNER_TEMP/$variant.txt"
          if [[ "$variant" == anonymous ]]; then
            if grep -Fq "TODO Authors" "$RUNNER_TEMP/$variant.txt"; then
              echo "ERROR anonymous variant exposes canonical authors" >&2
              exit 1
            fi
            if grep -Fq "Acknowledgements" "$RUNNER_TEMP/$variant.txt"; then
              echo "ERROR anonymous variant exposes acknowledgements" >&2
              exit 1
            fi
          fi
          if [[ "$variant" == camera-ready || "$variant" == arxiv ]]; then
            grep -Fq "TODO Authors" "$RUNNER_TEMP/$variant.txt"
            grep -Fq "Acknowledgements" "$RUNNER_TEMP/$variant.txt"
          fi

  paper-only:
    name: paper-only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the validated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Create a paper-only checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paper-only"
          cp -a paper "$RUNNER_TEMP/paper-only/paper"
          test ! -e "$RUNNER_TEMP/paper-only/.agents"

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Compile all variants with only paper present
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/paper-only/paper"
          for variant in draft anonymous camera_ready arxiv; do
            job="paper-only-$variant"
            latexmk -pdf -jobname="$job" -interaction=nonstopmode -halt-on-error "variants/$variant.tex"
            test -s "$job.pdf"
          done
